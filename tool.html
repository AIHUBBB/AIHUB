<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AIHUB - Tool Details</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <div class="logo">🤖 AIHUB</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="index.html#categories">Categories</a>
        <a href="index.html#tools">Tools</a>
    </div>
</nav>


<header>

    <div class="badge">
        🤖 AI TOOL
    </div>

    <h1 id="toolTitle">
        AI Tool
    </h1>

    <p id="toolDescription">
        Discover this AI tool.
    </p>

</header>


<section>

    <div class="tool-details-card">

        <div
            class="big-tool-icon"
            id="toolIcon"
        >
            🤖
        </div>


        <h2 id="toolName">
            AI Tool
        </h2>


        <div class="tool-info">

            <div class="info-box">

                <span>
                    ⭐ Rating
                </span>

                <strong id="toolRating">
                    4.8
                </strong>

            </div>


            <div class="info-box">

                <span>
                    💰 Price
                </span>

                <strong id="toolPrice">
                    Free + Paid
                </strong>

            </div>


            <div class="info-box">

                <span>
                    🧩 Category
                </span>

                <strong id="toolCategory">
                    AI
                </strong>

            </div>

        </div>


        <div class="features">

            <h2>
                ✨ Features
            </h2>

            <ul id="toolFeatures">
            </ul>

        </div>


        <div class="details-buttons">

            <a
                id="tryToolButton"
                class="try-button big-button"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >
                Try Tool →
            </a>


            <a
                href="index.html"
                class="back-button"
            >
                ← Back to AIHUB
            </a>

        </div>

    </div>

</section>


<footer>

    <h2>
        🤖 AIHUB
    </h2>

    <p>
        Discover the best AI tools in one place.
    </p>

    <p>
        © 2026 AIHUB
    </p>

</footer>


<script src="tool.js"></script>

</body>
</html>
