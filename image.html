</p>

<div class="workspace">

<h2>Image Prompt Builder</h2>

<input
id="imageSubject"
placeholder="Subject e.g. futuristic football stadium"
>

<select id="imageStyle">

<option>Realistic</option>
<option>Cinematic</option>
<option>Anime</option>
<option>3D Render</option>
<option>Digital Art</option>
<option>Fantasy</option>

</select>

<input
id="imageLighting"
placeholder="Lighting e.g. sunset"
>

<button
class="action-btn"
onclick="generateImagePrompt()"
>
Create Prompt
</button>

<div id="imageOutput" class="output">
Your image prompt will appear here.
</div>
